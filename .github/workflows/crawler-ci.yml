name: Crawler CI

on:
  push:
    branches: [ main, prod, test-ci-cd ]
    paths:
      - 'crawler/**'
      - '.github/workflows/crawler-ci.yml'
  pull_request:
    paths:
      - 'crawler/**'
      - '.github/workflows/crawler-ci.yml'
  workflow_dispatch:

jobs:
  crawler:
    name: Crawler tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crawler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests -q

