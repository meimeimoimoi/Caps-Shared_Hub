name: AI Service CI

on:
  push:
    branches: [ main, prod, test-ci-cd ]
    paths:
      - 'BE/ai-service/**'
      - '.github/workflows/ai-ci.yml'
  pull_request:
    paths:
      - 'BE/ai-service/**'
      - '.github/workflows/ai-ci.yml'
  workflow_dispatch:

jobs:
  ai-service:
    name: AI service tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BE/ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BE/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q

