name: CD — Build, push & deploy

on:
  push:
    branches: [ prod ]
    paths-ignore:
      - '*.md'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/agent-config.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

# Only one deploy at a time; queue the next, cancel nothing in-flight
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # ── Detect which components changed ──
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      expert: ${{ steps.filter.outputs.expert }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      crawler: ${{ steps.filter.outputs.crawler }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'BE/auth/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            expert:
              - 'BE/expert/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            gateway:
              - 'BE/gateway/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            frontend:
              - 'FE/**'
            ai-service:
              - 'BE/ai-service/**'
            crawler:
              - 'crawler/**'

  # ── Build & push Docker images ──
  build-dotnet:
    name: Build ${{ matrix.service }}
    needs: changes
    if: >-
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.expert == 'true' ||
      needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth
            changed: auth
            build-args: |
              SERVICE_NAME=auth
              PROJECT=auth/Api/Api.csproj
              APP_NAME=Caps.Auth.Api
          - service: expert
            changed: expert
            build-args: |
              SERVICE_NAME=expert
              PROJECT=expert/Api/Api.csproj
              APP_NAME=Caps.Expert.Api
          - service: gateway
            changed: gateway
            build-args: |
              SERVICE_NAME=gateway
    steps:
      - name: Skip if unchanged
        if: needs.changes.outputs[matrix.changed] != 'true'
        run: echo "No changes for ${{ matrix.service }}, skipping." && exit 0

      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.changed] == 'true'

      - uses: docker/login-action@v3
        if: needs.changes.outputs[matrix.changed] == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: needs.changes.outputs[matrix.changed] == 'true'
        with:
          context: BE
          file: BE/docker/Dockerfile.service
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/caps-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/caps-${{ matrix.service }}:${{ github.sha }}

  build-frontend:
    name: Build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: FE
          build-args: |
            VITE_API_GATEWAY_URL=${{ vars.VITE_API_GATEWAY_URL }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/caps-frontend:latest
            ${{ env.IMAGE_PREFIX }}/caps-frontend:${{ github.sha }}

  build-ai-service:
    name: Build ai-service
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: BE/ai-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/caps-ai-service:latest
            ${{ env.IMAGE_PREFIX }}/caps-ai-service:${{ github.sha }}

  build-crawler:
    name: Build crawler
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: crawler
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/caps-crawler:latest
            ${{ env.IMAGE_PREFIX }}/caps-crawler:${{ github.sha }}

  # ── Deploy to VPS ──
  deploy:
    name: Deploy to VPS
    needs: [ build-dotnet, build-frontend, build-ai-service, build-crawler ]
    # Run even if some build jobs were skipped (nothing changed for that component)
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check VPS configuration
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment skipped: configure VPS_HOST, VPS_USER and VPS_SSH_KEY in the production environment to enable deployment."
            echo "### Deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "VPS configuration is incomplete. Images were built, but no deployment was attempted." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy via SSH
        if: steps.vps.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ${{ vars.DEPLOY_PATH || '~/caps' }}
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

