name: CD — Build, push & deploy

on:
  push:
    branches: [ prod ]
    paths-ignore:
      - '*.md'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/agent-config.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Only one deploy at a time; queue the next, cancel nothing in-flight
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # ── Detect which components changed ──
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      auth: ${{ steps.filter.outputs.auth }}
      expert: ${{ steps.filter.outputs.expert }}
      billing: ${{ steps.filter.outputs.billing }}
      workflow: ${{ steps.filter.outputs.workflow }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      notification: ${{ steps.filter.outputs.notification }}
      rag-query: ${{ steps.filter.outputs.rag-query }}
      gateway: ${{ steps.filter.outputs.gateway }}
      migrator: ${{ steps.filter.outputs.migrator }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      crawler: ${{ steps.filter.outputs.crawler }}
      deploy-files: ${{ steps.filter.outputs.deploy-files }}
    steps:
      - name: Normalize GHCR owner
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'BE/auth/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            expert:
              - 'BE/expert/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            billing:
              - 'BE/billing/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            workflow:
              - 'BE/workflow/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            ingestion:
              - 'BE/ingestion/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            notification:
              - 'BE/notification/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            rag-query:
              - 'BE/rag-query/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            gateway:
              - 'BE/gateway/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.service'
            migrator:
              - 'BE/**/Migrations/**'
              - 'BE/auth/**'
              - 'BE/expert/**'
              - 'BE/billing/**'
              - 'BE/workflow/**'
              - 'BE/ingestion/**'
              - 'BE/notification/**'
              - 'BE/common/**'
              - 'BE/Directory.Build.props'
              - 'BE/Directory.Packages.props'
              - 'BE/docker/Dockerfile.migrator'
              - 'BE/docker/scripts/run-migrations.sh'
            frontend:
              - 'FE/**'
            ai-service:
              - 'BE/ai-service/**'
            crawler:
              - 'crawler/**'
            deploy-files:
              - 'BE/docker/**'

  # ── Build & push Docker images ──
  build-dotnet:
    name: Build ${{ matrix.service }}
    needs: changes
    if: >-
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.expert == 'true' ||
      needs.changes.outputs.billing == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.ingestion == 'true' ||
      needs.changes.outputs.notification == 'true' ||
      needs.changes.outputs.rag-query == 'true' ||
      needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth
            changed: auth
            build-args: |
              SERVICE_NAME=auth
              PROJECT=auth/Api/Api.csproj
              APP_NAME=Caps.Auth.Api
          - service: expert
            changed: expert
            build-args: |
              SERVICE_NAME=expert
              PROJECT=expert/Api/Api.csproj
              APP_NAME=Caps.Expert.Api
          - service: billing
            changed: billing
            build-args: |
              SERVICE_NAME=billing
              PROJECT=billing/Api/Api.csproj
              APP_NAME=Caps.Billing.Api
          - service: workflow
            changed: workflow
            build-args: |
              SERVICE_NAME=workflow
              PROJECT=workflow/Api/Api.csproj
              APP_NAME=Caps.Workflow.Api
          - service: ingestion
            changed: ingestion
            build-args: |
              SERVICE_NAME=ingestion
          - service: notification
            changed: notification
            build-args: |
              SERVICE_NAME=notification
          - service: rag-query
            changed: rag-query
            build-args: |
              SERVICE_NAME=rag-query
          - service: gateway
            changed: gateway
            build-args: |
              SERVICE_NAME=gateway
    steps:
      - name: Skip if unchanged
        if: needs.changes.outputs[matrix.changed] != 'true'
        run: echo "No changes for ${{ matrix.service }}, skipping." && exit 0

      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.changed] == 'true'

      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs[matrix.changed] == 'true'

      - uses: docker/login-action@v3
        if: needs.changes.outputs[matrix.changed] == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: needs.changes.outputs[matrix.changed] == 'true'
        with:
          context: BE
          file: BE/docker/Dockerfile.service
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=dotnet-${{ matrix.service }}
          cache-to: type=gha,scope=dotnet-${{ matrix.service }},mode=max
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-${{ matrix.service }}:latest
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-${{ matrix.service }}:${{ github.sha }}

  build-migrator:
    name: Build EF migrator
    needs: changes
    if: needs.changes.outputs.migrator == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: BE
          file: BE/docker/Dockerfile.migrator
          cache-from: type=gha,scope=dotnet-migrator
          cache-to: type=gha,scope=dotnet-migrator,mode=max
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-migrator:latest
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-migrator:${{ github.sha }}

  build-frontend:
    name: Build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: FE
          build-args: |
            VITE_API_URL=https://${{ vars.APP_DOMAIN }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-frontend:latest
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-frontend:${{ github.sha }}

  build-ai-service:
    name: Build ai-service
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: BE/ai-service
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,scope=ai-service,mode=max
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-ai-service:latest
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-ai-service:${{ github.sha }}

  build-crawler:
    name: Build crawler
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: crawler
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,scope=crawler,mode=max
          push: true
          tags: |
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-crawler:latest
            ghcr.io/${{ needs.changes.outputs.owner }}/caps-crawler:${{ github.sha }}

  # ── Deploy to VPS ──
  deploy:
    name: Deploy to VPS
    needs: [ changes, build-dotnet, build-migrator, build-frontend, build-ai-service, build-crawler ]
    # Run even if some build jobs were skipped (nothing changed for that component)
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check VPS configuration
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" && -n "$APP_DOMAIN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment skipped: configure VPS_HOST, VPS_USER, VPS_SSH_KEY and vars.APP_DOMAIN in the production environment."
            echo "### Deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "VPS configuration is incomplete. Images were built, but no deployment was attempted." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync deployment manifests to VPS
        if: steps.vps.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "BE/docker/docker-compose.prod.yml,BE/docker/docker-compose.gpu.yml,BE/docker/.env.example,BE/docker/caddy/Caddyfile,BE/docker/postgres/init-service-roles.sh,BE/docker/postgres/sync-roles.sh,BE/docker/postgres/db/database.sql,BE/docker/postgres/db/service-role.sql,BE/docker/scripts/init-vps.sh,BE/docker/seaweedfs/s3.json.example"
          target: ${{ vars.DEPLOY_PATH || '~/caps' }}
          strip_components: 2

      - name: Deploy via SSH
        if: steps.vps.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ${{ vars.DEPLOY_PATH || '~/caps' }}
            chmod +x postgres/*.sh scripts/*.sh

            if [ ! -f .env ]; then
              echo "Missing .env in $(pwd). Copy .env.example to .env, fill secrets, and run ./scripts/init-vps.sh." >&2
              exit 1
            fi
            if [ ! -f secrets/jwt-signing-key.pem ] || [ ! -f secrets/seaweedfs-s3.json ]; then
              ./scripts/init-vps.sh
            fi

            COMPOSE_FILES="-f docker-compose.prod.yml"
            if [ "${{ vars.ENABLE_GPU || 'false' }}" = "true" ]; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.gpu.yml"
            fi

            export GHCR_OWNER="${{ needs.changes.outputs.owner }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker compose $COMPOSE_FILES pull
            docker compose $COMPOSE_FILES up -d --wait postgres redis rabbitmq
            docker compose $COMPOSE_FILES exec -T postgres /usr/local/bin/sync-roles.sh
            docker compose $COMPOSE_FILES up -d seaweedfs seaweedfs-init qdrant ollama
            docker compose $COMPOSE_FILES run --rm migrator
            docker compose $COMPOSE_FILES up -d --remove-orphans
            docker image prune -f
