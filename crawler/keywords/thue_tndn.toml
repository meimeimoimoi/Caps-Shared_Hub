# Bộ từ khoá cào văn bản về thuế thu nhập doanh nghiệp (TNDN).
# Dùng: python scraper_agent.py --sources vbpl,mof --keywords-file keywords/thue_tndn.toml
#
# Mỗi từ khoá được gửi lên ô tìm kiếm của từng nguồn; tool chỉ GIỮ văn bản có TÊN
# (tiêu đề / trích yếu) chứa nguyên cụm từ khoá hoặc một alias của nhóm.

# Loại văn bản mặc định cho mọi nhóm (ghi đè bằng `doc_types` trong từng nhóm
# hoặc bằng --doc-types trên dòng lệnh)
doc_types = ["Luật", "Nghị định", "Thông tư", "Thông tư liên tịch", "Quyết định", "Văn bản hợp nhất"]

# 1. Từ khoá lõi - khớp trong tên văn bản.
# "sửa đổi, bổ sung ... thuế TNDN" và văn bản hợp nhất đã được bắt qua alias +
# loại "Văn bản hợp nhất", không cần từ khoá riêng.
[core]
terms = [
    "thuế thu nhập doanh nghiệp",
    "Luật Thuế thu nhập doanh nghiệp",
    "quy định chi tiết thi hành Luật Thuế thu nhập doanh nghiệp",
    "hướng dẫn thi hành Luật Thuế thu nhập doanh nghiệp",
    "thuế TNDN",
]
aliases = ["thuế thu nhập doanh nghiệp", "thuế TNDN"]

# 2. Từ khoá theo chủ đề nghiệp vụ - chỉ giữ khi TÊN văn bản chứa chính cụm đó
# (những cụm này cũng xuất hiện trong văn bản không thuộc thuế TNDN -> nên duyệt lại).
[topic]
terms = [
    "chi phí được trừ",
    "chi phí không được trừ",
    "thu nhập chịu thuế",
    "thu nhập miễn thuế",
    "thuế suất thuế thu nhập doanh nghiệp",
    "ưu đãi thuế",
    "chuyển lỗ",
    "quyết toán thuế",
    "tạm nộp thuế",
    "giao dịch liên kết",
    "chuyển giá",
    "khấu hao tài sản cố định",
    "trích lập dự phòng",
    "doanh thu tính thuế",
]

# 3. Biểu mẫu (03/TNDN, 01A/TNDN, 01B/TNDN...) không nằm trong tên văn bản ->
# liệt kê SỐ HIỆU văn bản gốc ban hành mẫu tờ khai / văn bản then chốt cần lấy chắc chắn.
# Nhóm tự xác nhận danh sách trước khi điền, ví dụ: "80/2021/TT-BTC".
[seeds]
so_hieu = []

# Thuế nhà thầu nước ngoài - để sau, đang tắt.
[contractor]
enabled = false
terms = ["nhà thầu nước ngoài"]
