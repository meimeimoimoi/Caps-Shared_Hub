# Production compose: pulls pre-built images from ghcr.io.
# Meant to run on the VPS after `docker compose pull && docker compose up -d`.
# Infrastructure services (postgres, redis, rabbitmq, seaweedfs) stay identical to development.
# Copy .env.example → .env, fill real passwords, and create secrets/jwt-signing-key.pem before first start.

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: caps_postgres
    restart: always
    environment:
      POSTGRES_DB: caps_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      CAPS_AUTH_DB_PASSWORD: ${CAPS_AUTH_DB_PASSWORD:?set it in .env}
      CAPS_EXPERT_DB_PASSWORD: ${CAPS_EXPERT_DB_PASSWORD:?set it in .env}
      CAPS_BILLING_DB_PASSWORD: ${CAPS_BILLING_DB_PASSWORD:?set it in .env}
      CAPS_WORKFLOW_DB_PASSWORD: ${CAPS_WORKFLOW_DB_PASSWORD:?set it in .env}
      CAPS_INGESTION_DB_PASSWORD: ${CAPS_INGESTION_DB_PASSWORD:?set it in .env}
      CAPS_NOTIFICATION_DB_PASSWORD: ${CAPS_NOTIFICATION_DB_PASSWORD:?set it in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-service-roles.sh:/docker-entrypoint-initdb.d/10-service-roles.sh:ro
      - ./postgres/db:/caps-db:ro
    networks:
      - caps_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caps_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - caps_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: caps_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - caps_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: caps_seaweedfs
    restart: always
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - caps_network

  # ── Application services (pre-built images from ghcr.io) ──

  auth:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-auth:latest
    container_name: caps_auth
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=caps_db;Username=caps_auth;Password=${CAPS_AUTH_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      Jwt__SigningKeys__0__PrivateKeyPath: /run/secrets/jwt_signing_key
      Auth__KnownProxies__0: 172.28.0.10
      Auth__DataProtectionKeysPath: /var/lib/caps-auth/keys
    secrets:
      - jwt_signing_key
    volumes:
      - auth_keys:/var/lib/caps-auth/keys
    ports:
      - "5194:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - caps_network

  expert:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-expert:latest
    container_name: caps_expert
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=caps_db;Username=caps_expert;Password=${CAPS_EXPERT_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks.json
      Jwt__RequireHttpsMetadata: "false"
      Storage__ServiceUrl: http://seaweedfs:8333
      Storage__AccessKey: ${SEAWEEDFS_ACCESS_KEY:-caps-dev-access}
      Storage__SecretKey: ${SEAWEEDFS_SECRET_KEY:-caps-dev-secret-change-me}
      AiService__BaseUrl: http://ai-service:8000
      AiService__InternalKey: ${AI_SERVICE_INTERNAL_KEY:-}
      # Called by workflow with X-Internal-Key (offers, slots, ratings)
      InternalApi__Key: ${EXPERT_INTERNAL_API_KEY:?set it in .env}
    ports:
      - "5198:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caps_network

  ingestion:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-ingestion:latest
    container_name: caps_ingestion
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=caps_db;Username=caps_ingestion;Password=${CAPS_INGESTION_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks.json
      Jwt__RequireHttpsMetadata: "false"
      Storage__ServiceUrl: http://seaweedfs:8333
      Storage__AccessKey: ${SEAWEEDFS_ACCESS_KEY:-caps-dev-access}
      Storage__SecretKey: ${SEAWEEDFS_SECRET_KEY:-caps-dev-secret-change-me}
      AiService__BaseUrl: http://ai-service:8000
      AiService__InternalKey: ${AI_SERVICE_INTERNAL_KEY:-}
      # Shared with crawler-worker, which calls the /internal endpoints
      InternalApi__Key: ${INGESTION_INTERNAL_API_KEY:?set it in .env}
    # No published port: /internal is only for crawler-worker on caps_network, users go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - caps_network

  billing:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-billing:latest
    container_name: caps_billing
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=caps_db;Username=caps_billing;Password=${CAPS_BILLING_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks.json
      Jwt__RequireHttpsMetadata: "false"
      # Called by workflow with X-Internal-Key (escrow hold, refund, settle)
      InternalApi__Key: ${BILLING_INTERNAL_API_KEY:?set it in .env}
      # Losing these keys makes every stored bank account number unreadable: keep the volume
      Billing__DataProtectionKeysPath: /var/lib/caps-billing/keys
      Billing__AccountHashKey: ${BILLING_ACCOUNT_HASH_KEY:?set it in .env}
      # PayOS collection channel (top-ups); empty keys make payments answer PAYMENT_UNAVAILABLE
      PayOS__ClientId: ${PAYOS_CLIENT_ID:-}
      PayOS__ApiKey: ${PAYOS_API_KEY:-}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
      PayOS__ReturnUrl: ${PUBLIC_URL:-http://localhost}/wallet?topup=success
      PayOS__CancelUrl: ${PUBLIC_URL:-http://localhost}/wallet?topup=cancelled
      # PayOS payout channel (chi hộ), separate keys; empty keys make transfers answer PAYMENT_UNAVAILABLE
      PayOS__PayoutClientId: ${PAYOS_PAYOUT_CLIENT_ID:-}
      PayOS__PayoutApiKey: ${PAYOS_PAYOUT_API_KEY:-}
      PayOS__PayoutChecksumKey: ${PAYOS_PAYOUT_CHECKSUM_KEY:-}
    volumes:
      - billing_keys:/var/lib/caps-billing/keys
    # No published port: users go through the gateway, workflow uses caps_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - caps_network

  workflow:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-workflow:latest
    container_name: caps_workflow
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=caps_db;Username=caps_workflow;Password=${CAPS_WORKFLOW_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks.json
      Jwt__RequireHttpsMetadata: "false"
      Expert__Url: http://expert:8080
      Expert__InternalKey: ${EXPERT_INTERNAL_API_KEY:?set it in .env}
      Billing__Url: http://billing:8080
      Billing__InternalKey: ${BILLING_INTERNAL_API_KEY:?set it in .env}
      Storage__ServiceUrl: http://seaweedfs:8333
      Storage__AccessKey: ${SEAWEEDFS_ACCESS_KEY:-caps-dev-access}
      Storage__SecretKey: ${SEAWEEDFS_SECRET_KEY:-caps-dev-secret-change-me}
      Services__AiService: http://ai-service:8000
      Services__AiServiceInternalKey: ${AI_SERVICE_INTERNAL_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      expert:
        condition: service_started
      billing:
        condition: service_started
    networks:
      - caps_network

  # Monthly crawl schedule: calls ingestion's /internal API, no published port
  cronjob:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-cronjob:latest
    container_name: caps_cronjob
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks.json
      Jwt__RequireHttpsMetadata: "false"
      Jobs__MonthlyCrawl__Enabled: "true"
      Jobs__MonthlyCrawl__IngestionUrl: http://ingestion:8080
      Jobs__MonthlyCrawl__InternalKey: ${INGESTION_INTERNAL_API_KEY:?set it in .env}
    depends_on:
      - ingestion
    networks:
      - caps_network

  gateway:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-gateway:latest
    container_name: caps_gateway
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks.json
      Jwt__RequireHttpsMetadata: "false"
      ReverseProxy__Clusters__auth-cluster__Destinations__auth__Address: http://auth:8080
      ReverseProxy__Clusters__expert-cluster__Destinations__expert__Address: http://expert:8080
      ReverseProxy__Clusters__ingestion-cluster__Destinations__ingestion__Address: http://ingestion:8080
      ReverseProxy__Clusters__billing-cluster__Destinations__billing__Address: http://billing:8080
      ReverseProxy__Clusters__workflow-cluster__Destinations__workflow__Address: http://workflow:8080
    ports:
      - "5190:8080"
    depends_on:
      - auth
      - expert
      - ingestion
      - billing
      - workflow
    networks:
      caps_network:
        ipv4_address: 172.28.0.10

  frontend:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-frontend:latest
    container_name: caps_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - caps_network

  ai-service:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-ai-service:latest
    container_name: caps_ai_service
    restart: always
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      INTERNAL_API_KEY: ${AI_SERVICE_INTERNAL_KEY:-}
      HF_HOME: /data/hf-cache
    volumes:
      - ai_hf_cache:/data/hf-cache
    ports:
      - "8000:8000"
    networks:
      - caps_network

  crawler:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-crawler:latest
    container_name: caps_crawler
    # Not a long-running service; started manually or by cron on the host.
    # Example: docker compose run --rm crawler --all --sources vbpl,mof --export
    profiles:
      - tools
    volumes:
      - crawler_data:/app/data
    networks:
      - caps_network

  # Same image as crawler, long-running: runs crawl jobs and parses uploads that ingestion publishes on RabbitMQ
  crawler-worker:
    image: ghcr.io/${GHCR_OWNER:-meimeimoimoi}/caps-crawler:latest
    container_name: caps_crawler_worker
    restart: always
    entrypoint: ["python", "worker.py"]
    environment:
      INGESTION_URL: http://ingestion:8080
      INTERNAL_API_KEY: ${INGESTION_INTERNAL_API_KEY:?set it in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/%2F
    volumes:
      - crawler_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      ingestion:
        condition: service_started
    networks:
      - caps_network

networks:
  caps_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

secrets:
  jwt_signing_key:
    file: ./secrets/jwt-signing-key.pem

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  seaweedfs_data:
  auth_keys:
  billing_keys:
  crawler_data:
  ai_hf_cache:

