version: '3.8'

services:
  # PostgreSQL Server with pgvector extension enabled for RAG/Vector Search
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: caps_postgres
    restart: always
    environment:
      POSTGRES_DB: caps_db
      POSTGRES_USER: postgres
      # Passwords come from docker/.env (copy docker/.env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in docker/.env}
      # One role per service, created by postgres/init-service-roles.sh on first start
      CAPS_AUTH_DB_PASSWORD: ${CAPS_AUTH_DB_PASSWORD:?set it in docker/.env}
      CAPS_EXPERT_DB_PASSWORD: ${CAPS_EXPERT_DB_PASSWORD:?set it in docker/.env}
      CAPS_BILLING_DB_PASSWORD: ${CAPS_BILLING_DB_PASSWORD:?set it in docker/.env}
      CAPS_WORKFLOW_DB_PASSWORD: ${CAPS_WORKFLOW_DB_PASSWORD:?set it in docker/.env}
      CAPS_INGESTION_DB_PASSWORD: ${CAPS_INGESTION_DB_PASSWORD:?set it in docker/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-service-roles.sh:/docker-entrypoint-initdb.d/10-service-roles.sh:ro
      - ../scripts/db:/caps-db:ro
    networks:
      - caps_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache Server
  redis:
    image: redis:7-alpine
    container_name: caps_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - caps_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker with Management UI
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: caps_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management Dashboard (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - caps_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Test mailbox: catches every email sent by notification, view at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: caps_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Giao diện web
    networks:
      - caps_network

  # S3-compatible object storage (SeaweedFS): stores expert applications/evidence.
  # S3 API: http://localhost:8333 · file browser: http://localhost:8899 · dev keys in seaweedfs/s3.json
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: caps_seaweedfs
    restart: always
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 API
      - "8899:8888" # Filer (duyệt file khi dev); 8888 hay bị Windows/Hyper-V giữ
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - caps_network

  auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: auth
        PROJECT: auth/Caps.Auth.Api/Caps.Auth.Api.csproj
        APP_NAME: Caps.Auth.Api
    container_name: caps_auth
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=caps_db;Username=caps_auth;Password=${CAPS_AUTH_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      Jwt__Key: CHANGE_ME_dev_only_min_32_chars_1234567890
    ports:
      - "5194:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - caps_network

  expert:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: expert
        PROJECT: expert/Caps.Expert.Api/Caps.Expert.Api.csproj
        APP_NAME: Caps.Expert.Api
    container_name: caps_expert
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=caps_db;Username=caps_expert;Password=${CAPS_EXPERT_DB_PASSWORD}
      Jwt__Key: CHANGE_ME_dev_only_min_32_chars_1234567890
      # SeaweedFS dev keys (seaweedfs/s3.json); real deployments use a secret store
      Storage__ServiceUrl: http://seaweedfs:8333
      Storage__AccessKey: caps-dev-access
      Storage__SecretKey: caps-dev-secret-change-me
    ports:
      - "5198:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caps_network

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: gateway
    container_name: caps_gateway
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: CHANGE_ME_dev_only_min_32_chars_1234567890
      # Inside the compose network services are reached by name, not localhost
      ReverseProxy__Clusters__auth-cluster__Destinations__auth__Address: http://auth:8080
      ReverseProxy__Clusters__expert-cluster__Destinations__expert__Address: http://expert:8080
    ports:
      - "5190:8080"
    depends_on:
      - auth
      - expert
    networks:
      - caps_network

networks:
  caps_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  seaweedfs_data:
